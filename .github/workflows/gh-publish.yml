name: Publish JAR to GitHub Packages
on:
  push:
    branches:
      - main
      - 'release/*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_USER: driessamyn
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
      GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Git Status
        run: git status
      - name: Untracked changes
        run: git ls-files . --exclude-standard --others
      - name: Print version
        run: ./gradlew printSemVersion --info
#      - name: Print Changelog
#        run: ./gradlew printChangeLog
      - name: Publish package
        run: ./gradlew deployGithub --info
