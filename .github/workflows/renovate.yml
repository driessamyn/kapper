name: Renovate

on:
  schedule:
    # Run daily so open PRs stay rebased; when PRs are created is gated by the
    # `schedule` in renovate.json.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        default: 'info'
        type: choice
        options: ['debug', 'info', 'warn']

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: renovate.json
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          # Self-hosted Renovate has no repository list of its own, and the
          # action has no `repositories` input, so tell it which repo to process.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Attribute Renovate's commits to a real account rather than the
          # Mend-owned default, which GitHub flags as unverified.
          RENOVATE_GIT_AUTHOR: 'Dries Samyn <5557551+driessamyn@users.noreply.github.com>'
          # Let Renovate run ./gradlew so it can regenerate the committed Gradle
          # lock files; without this they go stale and the lock-file check fails.
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: '["gradleWrapper"]'
