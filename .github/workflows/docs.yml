name: Deploy Documentation

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'core/src/**'
      - 'coroutines/src/**'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: "${{ github.event.pull_request.head.sha || 'main' }}"
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v4

      - name: Generate API documentation
        run: ./gradlew generateApiDocs

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v4

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: docs

      - name: Verify npm lock file is up to date
        run: |
          npm install --ignore-scripts --package-lock-only
          git diff --exit-code -- package-lock.json
          git ls-files --others --exclude-standard -- package-lock.json | grep -q . && { echo "Untracked package-lock.json present"; exit 1; } || true
        working-directory: docs

      - name: Build documentation
        run: npm run build
        working-directory: docs
        env:
          NODE_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1